<path d="M0 0H1200V187L1050 200 970 244 895 270 855 253 800 310 730 286 680 305 626 289 572 307 528 287 484 338 440 315 390 344 345 318 310 388 260 350 180 392 120 372 0 400Z" fill="url(#rust)" filter="url(#rough)"/>
