<path d="M0 360L220 300 300 335 355 280 400 310 462 273 525 297 573 262 625 292 688 256 750 274 813 233 900 252 960 200 1200 160" stroke="#f6b66e" stroke-width="9" fill="none" opacity=".7"/>
<rect width="1200" height="710" filter="url(#grain)" opacity=".8"/>
<path d="M0 405Q420 445 610 395T1200 432" stroke="#fff" stroke-width="5" opacity=".28" fill="none"/>
</g>
<g transform="translate(815 455) rotate(-24)"><path d="M-35 -20 H200 V45 H-35Z" fill="#7e4b2d" stroke="#df9c5d" stroke-width="6"/><path d="M-35 -28 H64 V52 H-35Z" fill="#d6dce0" stroke="#fff" stroke-width="4"/><path d="M-40 -35 H-14 V59 H-40Z" fill="#f6f5e9"/></g>
<g stroke="#ffd281" stroke-linecap="round" fill="none"><path d="M795 410l-65 -59" stroke-width="4"/><path d="M779 421l-91 5" stroke-width="3"/><path d="M788 397l-25 -90" stroke-width="3"/><path d="M810 390l28 -69" stroke-width="2"/><path d="M763 396l-53 -22" stroke-width="2"/></g>
<g fill="#ffe3a3"><circle cx="730" cy="347" r="6"/><circle cx="705" cy="428" r="4"/><circle cx="769" cy="301" r="4"/><circle cx="850" cy="316" r="3"/></g>
<text x="600" y="580" text-anchor="middle" fill="#d5cdc1" font-family="Arial,sans-serif" font-size="24" letter-spacing="7">SCRAPE THE RUST. SHIP THE SDK.</text>
<path d="M65 59H167M1033 59H1135M65 650H167M1033 650H1135" stroke="#a75c33" stroke-width="2"/>
